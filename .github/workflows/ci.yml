name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly: new advisories appear without any commit. Scheduled runs execute
  # the audit jobs only (the test jobs skip them).
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests scripts pg_smoke
          ruff format --check app tests scripts pg_smoke
      - name: Test
        run: pytest -q
  postgres-gate:
    # The suite above builds its SQLite schema from the ORM models, so it
    # cannot see migrations that disagree with the models. This job checks
    # the schema production actually gets (docs/alembic.md).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d build"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/build
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/build
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      # Test-only key for a throwaway database; never used outside CI.
      AUTH_JWT_SECRET: ci-postgres-gate-signing-key-0123456789abcdef
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements-dev.txt
      - name: Migrate an empty database to head
        run: alembic upgrade head
      - name: Single head, database at head
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic current | grep -q "(head)"
      - name: Latest migration round-trips
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Models match the migrated schema
        run: python scripts/check_schema_drift.py
      - name: Smoke tests against the migrated schema
        run: pytest pg_smoke -q
      - name: Rate-limit store against real Redis
        run: pytest tests/infrastructure/test_redis_counter_store.py -q
      - name: Service authentication against real Redis
        run: pytest tests/infrastructure/test_service_auth_middleware.py -q
      - name: Signed AI-service callbacks against real Redis
        run: pytest tests/integration/content/test_signed_callbacks.py -q
  storage-gate:
    # The object-storage adapter against a real S3-compatible service:
    # SeaweedFS pinned by digest, with identities generated for this run
    # (scripts/seaweedfs_test_storage.sh). The tests are required here:
    # missing configuration is a collection error, and any skipped test
    # fails the job, so it cannot pass without exercising the real service.
    if: github.event_name != 'schedule'
    name: Object storage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements-dev.txt
      - name: Start SeaweedFS with generated identities
        run: scripts/seaweedfs_test_storage.sh start "$GITHUB_ENV"
      - name: Object storage against the real service (required, none skipped)
        env:
          OBJECT_STORAGE_TESTS_REQUIRED: '1'
        run: |
          pytest tests/infrastructure/content/test_s3_object_storage_real.py             tests/integration/content/test_content_upload_real_storage.py             -q -rA -p no:cacheprovider | tee storage-tests.log
          if grep -qE '(^SKIPPED|[0-9]+ skipped)' storage-tests.log; then
            echo "::error::object-storage tests were skipped; they are required in this job"
            exit 1
          fi
      - name: SeaweedFS logs on failure
        if: failure()
        run: docker logs build-test-seaweedfs 2>&1 | tail -100 || true
      - name: Stop SeaweedFS
        if: always()
        run: scripts/seaweedfs_test_storage.sh stop
  security:
    # Known advisories in the pinned dependencies, under the exception policy
    # (docs/security-advisories.md). Needs the network for the advisory
    # database.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: |
          python -m pip install pip==26.2.1
          pip install pip-audit==2.10.1
      - name: Audit requirements.txt and requirements-dev.txt
        run: python -m scripts.audit_python_packages requirements
  image:
    # The production image as it would be deployed: built from this commit,
    # then its contents and user, its Python packages and its OS packages.
    # Nothing is published from this workflow; a publish step added later
    # must `needs: image` so only a checked and audited image can ship.
    name: Production image
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build the production image
        run: >-
          docker build --target production
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t build-backend:ci .
      - name: Build the runtime stage
        run: docker build --target runtime -t build-backend-runtime:ci .
      - name: Learning-memory gate (scripts/check_memory_gate_image.sh)
        run: scripts/check_memory_gate_image.sh build-backend:ci build-backend-runtime:ci
      - name: Contents and user (scripts/check_backend_image.sh)
        run: scripts/check_backend_image.sh build-backend:ci
      - name: Python packages in the image
        run: |
          python -m pip install pip==26.2.1
          pip install pip-audit==2.10.1
          python -m scripts.audit_python_packages image build-backend:ci
      - name: OS packages in the image (scripts/scan_image_os.sh)
        run: scripts/scan_image_os.sh build-backend:ci
  secrets:
    # Secrets in the tracked files: gitleaks, pinned by digest, findings
    # redacted (scripts/scan_secrets.sh). Accepted findings: .gitleaksignore.
    # Not scheduled: with the scanner pinned, only a commit can add a finding.
    if: github.event_name != 'schedule'
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan the tracked files
        run: scripts/scan_secrets.sh
