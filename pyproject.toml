[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "build-backend"
version = "0.1.0"
description = "Modular monolith backend foundation for BUILD"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "alembic>=1.13.0",
  "asyncpg>=0.27.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-sdk>=1.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-env>=1.1.5",
  "respx>=0.21.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.4.0",
  "aiosqlite>=0.18.0",
]

[tool.ruff]
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "APP_ENVIRONMENT=testing",
]