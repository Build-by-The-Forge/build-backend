[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "build-backend"
version = "0.1.0"
description = "Modular monolith backend foundation for BUILD"
requires-python = ">=3.12"
# Dependencies are declared only in requirements.txt (runtime) and
# requirements-dev.txt (tooling), with exact pins for the full closure. The
# project is not installed: the image runs from /app, tests from the checkout.

[tool.ruff]
line-length = 130
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# This repository's own top-level packages. `src` alone left ruff deciding
# per file: first-party only where __init__.py files chain up to app/,
# third-party everywhere else (including every test).
known-first-party = ["app", "scripts", "tests", "pg_smoke", "boundary"]

[tool.black]
target-version = ["py314"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = "alembic"

[[tool.mypy.overrides]]
module = "app.application.identity.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "APP_ENVIRONMENT=testing",
]
