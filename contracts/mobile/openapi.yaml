openapi: 3.1.0
info:
  title: BUILD Mobile API
  version: 0.1.0
  description: >
    The intended student API for the first mobile release. It describes what the
    system must guarantee, not what the backend does today: accepting this contract
    doesn't mean an operation is implemented. Differences from today's backend are
    tracked in docs/mobile-m0-inventory.md and, from M2, in the machine-readable gap
    allowlist. Rules are in docs/mobile-api-conventions.md.

    Every response carries X-Request-ID. A client may send X-Request-ID matching
    [A-Za-z0-9._:-]{1,128}; any other value is replaced. Clients must ignore response
    fields they don't know, and must treat an unknown error code like INTERNAL_ERROR.
tags:
  - name: identity
  - name: tenants
  - name: catalogue
  - name: academic
  - name: content
  - name: assessment
  - name: ai
security:
  - bearerAuth: []

paths:
  /identity/users:
    post:
      tags: [identity]
      operationId: registerUser
      summary: Register a student account
      description: >
        A bodyless 202, identical whether or not the email already has an account, so
        registration can't be used to discover accounts. A 202 means the request is
        recorded and survives a restart, not that a new account exists: a worker looks for
        the account afterwards. A verification email follows for a new account, usually
        within a few seconds, and signing in before then can answer
        AUTH_INVALID_CREDENTIALS. Registering again is safe. A failure to record the
        request answers 500.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Accepted, with no response body
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/authenticate:
    post:
      tags: [identity]
      operationId: authenticate
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionIssued' }
        '401':
          description: AUTH_INVALID_CREDENTIALS, with the same response for an unknown account and a wrong password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: ACCOUNT_NOT_ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/refresh:
    post:
      tags: [identity]
      operationId: refreshSession
      summary: Rotate the refresh token
      description: >
        Clients allow one refresh at a time per session, and save the new refresh token
        before using the new access token. Reusing a rotated token revokes the session.
        After AUTH_REFRESH_INVALID the client signs out and never retries that token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionIssued' }
        '401':
          description: AUTH_REFRESH_INVALID. Expired, revoked and reused tokens look the same
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: Revoke this session
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/logout-all:
    post:
      tags: [identity]
      operationId: logoutAll
      summary: Revoke every session of this user
      responses:
        '200': { $ref: '#/components/responses/RevokedSessions' }
        '400':
          description: CURRENT_PASSWORD_INCORRECT. Not 401, which tells a client to refresh and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: The signed-in user
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/memberships:
    get:
      tags: [identity]
      operationId: listMemberships
      summary: Tenants this user can select
      description: Small by nature, so unpaginated. An unverified user sees memberships but can't use them yet.
      x-unpaginated: true
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/verify-email:
    post:
      tags: [identity]
      operationId: verifyEmail
      summary: Confirm an email address with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400':
          description: TOKEN_INVALID. Expired, used and unknown tokens look the same
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/resend-verification:
    post:
      tags: [identity]
      operationId: resendVerification
      summary: Send the verification email again
      description: The response doesn't reveal whether the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/forgot-password:
    post:
      tags: [identity]
      operationId: forgotPassword
      summary: Request a password reset email
      description: The response doesn't reveal whether the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/reset-password:
    post:
      tags: [identity]
      operationId: resetPassword
      summary: Set a new password with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400':
          description: TOKEN_INVALID. Expired, used and unknown tokens look the same
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /identity/change-password:
    post:
      tags: [identity]
      operationId: changePassword
      summary: Change the password of the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/RevokedSessions' }
        '400':
          description: CURRENT_PASSWORD_INCORRECT. Not 401, which tells a client to refresh and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tenants/{slug}/join:
    post:
      tags: [tenants]
      operationId: joinTenant
      summary: Join a tenant under its join policy
      description: >
        Requires a verified email. Repeating it returns the existing membership. An
        unknown tenant and a refused join give the same TENANT_ACCESS_DENIED.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MembershipResult' }
        '201': { $ref: '#/components/responses/MembershipResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: EMAIL_VERIFICATION_REQUIRED or TENANT_ACCESS_DENIED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invitations/accept:
    post:
      tags: [tenants]
      operationId: acceptInvitation
      summary: Accept a tenant invitation with its emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/MembershipResult' }
        '400':
          description: TOKEN_INVALID. Expired, used, unknown and other users' tokens look the same
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: EMAIL_VERIFICATION_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/faculties:
    get:
      tags: [catalogue]
      operationId: listFaculties
      summary: Active faculties of the tenant
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Faculties, ordered by name then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Faculty' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/departments:
    get:
      tags: [catalogue]
      operationId: listDepartments
      summary: Active departments of the tenant
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: faculty_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Departments, ordered by name then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/programmes:
    get:
      tags: [catalogue]
      operationId: listProgrammes
      summary: Active programmes of the tenant
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: department_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Programmes, ordered by name then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Programme' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/courses:
    get:
      tags: [catalogue]
      operationId: listCourses
      summary: Published courses of the tenant
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: department_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Courses, ordered by code then id. Unpublished courses never appear
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/courses/{course_id}:
    get:
      tags: [catalogue]
      operationId: getCourse
      summary: One published course
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: The course
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/courses/{course_id}/topics:
    get:
      tags: [catalogue]
      operationId: listTopics
      summary: Active topics of a course
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Topics, ordered by sequence then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/topics/{topic_id}/learning-outcomes:
    get:
      tags: [catalogue]
      operationId: listLearningOutcomes
      summary: Active learning outcomes of a topic
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/TopicId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Learning outcomes, ordered by sequence then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LearningOutcome' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalogue/topics/{topic_id}/reference-materials:
    get:
      tags: [catalogue]
      operationId: listReferenceMaterials
      summary: Active reference materials of a topic's course
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/TopicId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Reference materials, ordered by title then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReferenceMaterial' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /academic/profile:
    get:
      tags: [academic]
      operationId: getAcademicProfile
      summary: The student's academic profile in the tenant
      description: >
        Programme, level and enrolled courses. Before the first save it answers 200 with
        every field null, no courses and complete false. A programme the student can no
        longer read reads as null with complete false, and an enrolled course the student
        can no longer read is left out. Student memberships only.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AcademicProfile' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [academic]
      operationId: putAcademicProfile
      summary: Replace the student's academic profile
      description: >
        Replaces the programme, level and courses as a whole. Of two concurrent saves, the
        stored profile is exactly one of them, never a mix. Each reference must be one a
        student of this tenant can read: an active programme of an active department, an
        active level, and active courses under an active department and faculty. Anything
        else is VALIDATION_FAILED naming the field, the same answer whether it doesn't
        exist, belongs to another tenant or is archived. Student memberships only.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcademicProfileUpdate' }
      responses:
        '200':
          description: The stored profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AcademicProfile' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/my-documents:
    get:
      tags: [content]
      operationId: listMyDocuments
      summary: Documents this student uploaded in this tenant
      description: My Shelf. The filters match the shelf form's values; an unfilled document matches no filter.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ShelfLevel'
        - $ref: '#/components/parameters/ShelfCourseId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Documents, newest first, then by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [content]
      operationId: uploadMyDocument
      summary: Upload a private document and queue it for ingestion
      description: >
        The raw document is the request body. The document is private to this student.
        A success means the document and its queued ingestion job are committed together,
        so a successful upload can't be left permanently unqueued. A failure before that
        commit leaves no document, and any stored bytes are removed later. Type, size and
        SHA-256 come from the bytes; the Content-Type header decides nothing. The same
        key and bytes return the original document with 200. Nothing in any response
        shows whether another student holds the same file.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: file_name
          in: query
          description: Display name only, percent-encoded
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/DocumentResult' }
        '201': { $ref: '#/components/responses/DocumentResult' }
        '400':
          description: TENANT_REQUIRED or EMPTY_UPLOAD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '408':
          description: UPLOAD_READ_TIMEOUT. Retry with the same key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: >
            IDEMPOTENCY_KEY_REUSED, or DUPLICATE_CONTENT when this student already holds
            these bytes. existing_asset_id only ever names the caller's own document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: UPLOAD_TOO_LARGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE. PDF, PNG and JPEG are accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /content/my-documents/{asset_id}:
    get:
      tags: [content]
      operationId: getMyDocument
      summary: One of this student's documents, including its ingestion state
      description: Poll this with bounded backoff to follow ingestion.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200': { $ref: '#/components/responses/DocumentResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [content]
      operationId: deleteMyDocument
      summary: Delete one of this student's documents
      description: >
        Once this succeeds, the document can't be listed, opened, retrieved or newly cited,
        and its derived data leaves active retrieval.
        Repeating it after success returns RESOURCE_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [content]
      operationId: updateMyDocument
      summary: Fill in the shelf form for one of this student's documents
      description: >
        Sets only the fields sent; null clears one. course_id must be an active course of
        this tenant, and level one the tenant offers. Nothing here publishes the document or
        changes who can read it.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentForm' }
      responses:
        '200': { $ref: '#/components/responses/DocumentResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/my-documents/{asset_id}/retry:
    post:
      tags: [content]
      operationId: retryMyDocument
      summary: Retry ingestion of a failed document
      description: >
        Only when ingestion.retry_available is true. A repeat while the retry is in
        progress returns the document's current state and starts nothing new.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200': { $ref: '#/components/responses/DocumentResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INGESTION_NOT_RETRYABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/my-documents/{asset_id}/publication-request:
    post:
      tags: [content]
      operationId: requestPublication
      summary: Ask to publish one of this student's documents to the tenant shelf
      description: >
        Records the student's consent and rights declaration, each with the wording version
        they accepted. While the tenant's mode is own_work_automatic, an own_work declaration
        shared with the tenant publishes at once, if the document is ready, scanned clean and
        its bytes aren't on the tenant's takedown blocklist. Anything else becomes requested
        and stays private. The answer reveals nothing about any other student. Publishing
        never makes a document usable in anyone's answers. A repeat returns the current state.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationRequest' }
      responses:
        '200': { $ref: '#/components/responses/DocumentResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: DOCUMENT_NOT_READY, or SHELF_PUBLICATION_OFF while the tenant's shelf is off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/my-documents/{asset_id}/publication:
    delete:
      tags: [content]
      operationId: withdrawPublication
      summary: Withdraw a publication or a pending request
      description: >
        Effective at once: the document leaves the shelf at this commit. A repeat, or a
        document that was never published, returns the current state.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200': { $ref: '#/components/responses/DocumentResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/tenant-shelf:
    get:
      tags: [content]
      operationId: listTenantShelf
      summary: Documents published to this tenant's shelf
      description: >
        Discoverable only by authorized students of this tenant, never the open internet.
        A document leaves the shelf at the commit any publication condition stops holding.
        No item names its uploader. Open one through /content/assets/{asset_id}.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ShelfLevel'
        - $ref: '#/components/parameters/ShelfCourseId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Published documents, newest publication first, then by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ShelfDocument' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/tenant-shelf/{asset_id}/report:
    post:
      tags: [content]
      operationId: reportShelfDocument
      summary: Report a published document to the tenant's takedown contact
      description: >
        Only a student who can see the document can report it. One active report per account
        per document: a repeat changes nothing. The uploader is never told who reported.
        Three reports from distinct students hide the document until the takedown contact
        reviews it; hiding is not a takedown and changes no rights or AI eligibility.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfReport' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/sources:
    get:
      tags: [content]
      operationId: listSources
      summary: Shared sources this student may read
      description: Never includes another student's personal source.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Sources, ordered by name then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/sources/{source_id}/assets:
    get:
      tags: [content]
      operationId: listSourceDocuments
      summary: Ready documents in a shared source
      description: Only material whose rights and audience have been verified for students.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: source_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Documents, newest first, then by id. Superseded and revoked versions never appear
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/assets/{asset_id}:
    get:
      tags: [content]
      operationId: getDocument
      summary: One document this student may read
      description: Another student's private document gives the same RESOURCE_NOT_FOUND as one that doesn't exist.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200': { $ref: '#/components/responses/DocumentResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/assets/{asset_id}/content:
    get:
      tags: [content]
      operationId: getDocumentContent
      summary: The document's bytes, for opening it in the app
      description: >
        Streamed by the backend, which authorizes every request, so there is no reusable
        URL and no storage address reaches the client. Supports Range requests. A failure
        uses the JSON error envelope.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssetId'
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The whole document
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '206':
          description: The requested range
          headers:
            ETag: { schema: { type: string } }
            Content-Range: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            DOCUMENT_NOT_AVAILABLE: the owner's document is quarantined or rejected by its
            security scan, so its bytes aren't served, to its owner included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '416':
          description: RANGE_NOT_SATISFIABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /assessment/assessments:
    get:
      tags: [assessment]
      operationId: listAssessments
      summary: Published assessments of the tenant
      description: Drafts never appear. Questions are available only through an attempt.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: course_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Assessments, newest first, then by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Assessment' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/assessments/{assessment_id}:
    get:
      tags: [assessment]
      operationId: getAssessment
      summary: One published assessment
      description: A draft gives the same RESOURCE_NOT_FOUND as an assessment that doesn't exist.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: The assessment, without its questions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Assessment' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/assessments/{assessment_id}/attempts:
    post:
      tags: [assessment]
      operationId: startAttempt
      summary: Start an attempt, or return the one in progress
      description: >
        Follows the assessment's attempt_policy, which the server enforces. A new attempt
        needs every earlier attempt to be finalized and attempts_used below max_attempts.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200': { $ref: '#/components/responses/AttemptResult' }
        '201': { $ref: '#/components/responses/AttemptResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ATTEMPT_LIMIT_REACHED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/attempts:
    get:
      tags: [assessment]
      operationId: listAttempts
      summary: This student's attempts in this tenant
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Attempts, newest first, then by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/attempts/{attempt_id}:
    get:
      tags: [assessment]
      operationId: getAttempt
      summary: One of this student's attempts
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': { $ref: '#/components/responses/AttemptResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/attempts/{attempt_id}/questions:
    get:
      tags: [assessment]
      operationId: getAttemptQuestions
      summary: The attempt's immutable question snapshot
      description: Never contains answer keys or explanations.
      x-unpaginated: true
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Questions, in sequence
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AttemptQuestions' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/attempts/{attempt_id}/answers:
    get:
      tags: [assessment]
      operationId: getAttemptAnswers
      summary: Answers saved so far
      x-unpaginated: true
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Saved answers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AttemptAnswers' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/attempts/{attempt_id}/answers/{assessment_question_id}:
    put:
      tags: [assessment]
      operationId: saveAnswer
      summary: Save the answer to one question
      description: A repeat leaves one answer.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AssessmentQuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAnswerRequest' }
      responses:
        '200':
          description: The saved answer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AttemptAnswer' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AttemptClosed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [assessment]
      operationId: deleteAnswer
      summary: Remove the answer to one question
      description: A repeat succeeds and leaves no answer.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AssessmentQuestionId'
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AttemptClosed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/attempts/{attempt_id}/submit:
    post:
      tags: [assessment]
      operationId: submitAttempt
      summary: Submit the attempt
      description: >
        Grades the saved answers once. A repeat returns the submitted attempt and never
        grades again, so a client that lost the response can safely retry. Submitting
        after expires_at succeeds and grades what was saved in time.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': { $ref: '#/components/responses/AttemptResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assessment/attempts/{attempt_id}/result:
    get:
      tags: [assessment]
      operationId: getAttemptResult
      summary: The graded result of a submitted attempt
      description: >
        Available only once result_visibility permits it, otherwise RESULT_NOT_RELEASED.
        Per-question feedback is a separate condition: is_correct and awarded_marks stay
        null until result and feedback are both permitted. Neither setting overrides the
        other, and no other route returns this feedback.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: The result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AttemptResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ATTEMPT_NOT_SUBMITTED or RESULT_NOT_RELEASED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai/conversations:
    get:
      tags: [ai]
      operationId: listConversations
      summary: This student's conversations in this tenant
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Conversations, most recently updated first, then by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [ai]
      operationId: createConversation
      summary: Start an empty conversation
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/ConversationResult' }
        '201': { $ref: '#/components/responses/ConversationResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai/conversations/{conversation_id}:
    get:
      tags: [ai]
      operationId: getConversation
      summary: One of this student's conversations
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200': { $ref: '#/components/responses/ConversationResult' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [ai]
      operationId: deleteConversation
      summary: Delete one of this student's conversations
      description: Repeating it after success returns RESOURCE_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai/conversations/{conversation_id}/messages:
    get:
      tags: [ai]
      operationId: listMessages
      summary: Messages of a conversation
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Messages, oldest first, then by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ConversationMessage' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [ai]
      operationId: sendMessage
      summary: Ask a question in a conversation
      description: >
        Every question enforces ownership and eligibility: answers come only from this
        student's personal knowledge and institutional knowledge they're eligible for, and
        only from documents whose latest ingestion is ready. The turn is stored only after the AI step succeeds. The same key returns the
        stored turn without asking again. Each turn is answered on its own: the question
        doesn't see earlier turns in this contract version.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: The answer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ChatAnswer' }
        '400': { $ref: '#/components/responses/TenantRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            IDEMPOTENCY_KEY_REUSED with a different message, or TURN_IN_PROGRESS while this
            key's earlier request is still being answered. Retry the same key after
            Retry-After seconds; it returns the stored turn once there is one
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: AI_UPSTREAM_ERROR. No answer is stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: >
            AI_UNAVAILABLE or OBJECT_STORAGE_UNAVAILABLE, or ANSWER_WITHHELD: a document the
            answer used stopped being readable by this student while it was generated, so the
            whole answer is withheld, cited or not, and nothing is stored. Retryable: a retry
            retrieves afresh and leaves that document out
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from authenticate or refresh. Use expires_in, not an assumed lifetime.

  parameters:
    TenantSlug:
      name: X-Tenant-Slug
      in: header
      required: true
      description: The selected tenant. Context, not proof; membership is checked on every request.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    ShelfLevel:
      name: level
      in: query
      schema: { type: integer, enum: [100, 200, 300, 400, 500, 600] }
    ShelfCourseId:
      name: course_id
      in: query
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
    CourseId:
      name: course_id
      in: path
      required: true
      schema: { type: string }
    TopicId:
      name: topic_id
      in: path
      required: true
      schema: { type: string }
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string }
    AssessmentId:
      name: assessment_id
      in: path
      required: true
      schema: { type: string }
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: { type: string }
    AssessmentQuestionId:
      name: assessment_question_id
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string }

  responses:
    EmptySuccess:
      description: Done
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Empty' }
    SessionIssued:
      description: A new session or rotated tokens
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/AuthSession' }
    RevokedSessions:
      description: How many sessions were revoked
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/RevokedSessions' }
    MembershipResult:
      description: The membership. 201 if new, 200 if it already existed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Membership' }
    DocumentResult:
      description: The document. On upload, 201 if new and 200 on a replay
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Document' }
    AttemptResult:
      description: The attempt. On start, 201 if new and 200 if one was in progress
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Attempt' }
    ConversationResult:
      description: The conversation. On create, 201 if new and 200 on a replay
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Conversation' }
    TenantRequired:
      description: TENANT_REQUIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: AUTH_TOKEN_INVALID. Refresh once, then retry the request once
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: >
        EMAIL_VERIFICATION_REQUIRED, PERMISSION_DENIED or TENANT_ACCESS_DENIED. An unknown
        tenant and a tenant the user doesn't belong to look the same
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: >
        RESOURCE_NOT_FOUND. Also used for another tenant's resources, another student's
        private resources and unpublished resources, with an identical response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AttemptClosed:
      description: ATTEMPT_ALREADY_SUBMITTED or ATTEMPT_EXPIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: VALIDATION_FAILED, with field errors. Submitted values are never echoed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: RATE_LIMITED. The response doesn't reveal which limit fired
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: INTERNAL_ERROR. Never contains exception text
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: AI_UNAVAILABLE or OBJECT_STORAGE_UNAVAILABLE
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Empty:
      type: object
      additionalProperties: false
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
    PageMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [pagination]
          properties:
            pagination:
              type: object
              required: [total, limit, offset]
              properties:
                total: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 100 }
                offset: { type: integer, minimum: 0 }
    SuccessEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: {}
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    PageEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { type: array }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
    Error:
      type: object
      required: [code, message, details]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: Safe to show, and may change. Branch on code.
        details:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ValidationDetails'
            - $ref: '#/components/schemas/DuplicateDetails'
    ErrorCode:
      type: string
      enum:
        - TENANT_REQUIRED
        - TOKEN_INVALID
        - EMPTY_UPLOAD
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_INVALID
        - AUTH_REFRESH_INVALID
        - ACCOUNT_NOT_ACTIVE
        - EMAIL_VERIFICATION_REQUIRED
        - TENANT_ACCESS_DENIED
        - PERMISSION_DENIED
        - BAD_REQUEST
        - CURRENT_PASSWORD_INCORRECT
        - RESOURCE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - UPLOAD_READ_TIMEOUT
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CONTENT
        - INGESTION_NOT_RETRYABLE
        - ATTEMPT_ALREADY_SUBMITTED
        - ATTEMPT_EXPIRED
        - ATTEMPT_NOT_SUBMITTED
        - ATTEMPT_LIMIT_REACHED
        - RESULT_NOT_RELEASED
        - UPLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RANGE_NOT_SATISFIABLE
        - DOCUMENT_NOT_AVAILABLE
        - DOCUMENT_NOT_READY
        - SHELF_PUBLICATION_OFF
        - VALIDATION_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - AI_UPSTREAM_ERROR
        - AI_UNAVAILABLE
        - ANSWER_WITHHELD
        - TURN_IN_PROGRESS
        - OBJECT_STORAGE_UNAVAILABLE
        - SERVICE_UNAVAILABLE
    ValidationDetails:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields:
          type: array
          items:
            type: object
            required: [field, code, message]
            additionalProperties: false
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    DuplicateDetails:
      type: object
      required: [existing_asset_id]
      additionalProperties: false
      properties:
        existing_asset_id:
          type: string
          description: Always one of the caller's own documents.

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    AuthenticateRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
        device_id:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,36}$'
          description: >
            An opaque ID the app keeps for this install. It's recorded for the user once the
            password verifies. If it belongs to another user, the session has no device and
            the sign-in still succeeds.
        user_agent: { type: string, maxLength: 512 }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, writeOnly: true }
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, writeOnly: true }
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string, writeOnly: true }
        password: { type: string, writeOnly: true }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, writeOnly: true }
        new_password: { type: string, writeOnly: true }
        revoke_other_sessions: { type: boolean, default: true }
    AuthSession:
      type: object
      required: [user_id, session_id, access_token, token_type, expires_in, refresh_token]
      properties:
        user_id: { type: string }
        session_id: { type: string }
        device_id: { type: [string, 'null'] }
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        refresh_token: { type: string }
    RevokedSessions:
      type: object
      required: [revoked_sessions]
      properties:
        revoked_sessions: { type: integer, minimum: 0 }
    User:
      type: object
      required: [id, email, status, email_verified]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        status: { type: string }
        email_verified: { type: boolean }
    Membership:
      type: object
      required: [tenant_slug, tenant_name, membership_id, role]
      properties:
        tenant_slug: { type: string }
        tenant_name: { type: string }
        membership_id: { type: string }
        role: { type: string }

    Faculty:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
    Department:
      type: object
      required: [id, faculty_id, name, slug]
      properties:
        id: { type: string }
        faculty_id: { type: string }
        name: { type: string }
        slug: { type: string }
    AcademicProfile:
      type: object
      description: >
        Department and faculty are read from the programme, so they can't disagree with it.
        complete is true when a readable programme and a level are set.
      required: [programme, department, faculty, level, courses, complete, updated_at]
      properties:
        programme:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProfileProgramme'
        department:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProfileUnit'
        faculty:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProfileUnit'
        level: { type: [integer, 'null'], description: 'A level code of the tenant, such as 300' }
        courses:
          type: array
          description: Ordered by code, then id
          items: { $ref: '#/components/schemas/ProfileCourse' }
        complete: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }
    ProfileProgramme:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
    ProfileUnit:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    ProfileCourse:
      type: object
      required: [id, code, title, level, semester, credit_units]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        level: { type: integer }
        semester: { type: integer }
        credit_units: { type: integer }
    AcademicProfileUpdate:
      type: object
      additionalProperties: false
      required: [programme_id, level, course_ids]
      properties:
        programme_id: { type: string, minLength: 1, maxLength: 36 }
        level: { type: integer }
        course_ids:
          type: array
          maxItems: 30
          uniqueItems: true
          description: May be empty
          items: { type: string, minLength: 1, maxLength: 36 }
    Programme:
      type: object
      required: [id, faculty_id, department_id, name, slug, code, duration_years]
      properties:
        id: { type: string }
        faculty_id: { type: string }
        department_id: { type: string }
        name: { type: string }
        slug: { type: string }
        code: { type: string }
        duration_years: { type: integer, minimum: 1 }
    Course:
      type: object
      required: [id, department_id, code, title, slug, credit_units, level, semester]
      properties:
        id: { type: string }
        department_id: { type: string }
        code: { type: string }
        title: { type: string }
        slug: { type: string }
        credit_units: { type: integer }
        level: { type: integer }
        semester: { type: integer }
        description: { type: [string, 'null'] }
    Topic:
      type: object
      required: [id, course_id, title, slug, sequence]
      properties:
        id: { type: string }
        course_id: { type: string }
        title: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        sequence: { type: integer }
    LearningOutcome:
      type: object
      required: [id, topic_id, sequence, description]
      properties:
        id: { type: string }
        topic_id: { type: string }
        sequence: { type: integer }
        description: { type: string }
    ReferenceMaterial:
      type: object
      required: [id, course_id, title, material_type]
      properties:
        id: { type: string }
        course_id: { type: string }
        title: { type: string }
        material_type: { type: string }
        url: { type: [string, 'null'] }

    Source:
      type: object
      required: [id, name, source_type, authority_level]
      properties:
        id: { type: string }
        name: { type: string }
        source_type: { type: string }
        authority_level: { type: string }
        description: { type: [string, 'null'] }
        author_name: { type: [string, 'null'] }
        publisher: { type: [string, 'null'] }
        isbn_or_doi: { type: [string, 'null'] }
        source_url: { type: [string, 'null'] }
    Document:
      type: object
      required: [id, source_id, title, mime_type, size_bytes, content_sha256, ownership, knowledge_scope, ingestion, course_id, level, semester, document_type, publication, created_at, updated_at]
      properties:
        id: { type: string }
        source_id: { type: string }
        title: { type: string, description: The file's display name }
        mime_type:
          type: string
          enum: [application/pdf, image/png, image/jpeg]
        size_bytes: { type: integer, minimum: 1 }
        content_sha256:
          type: string
          description: Compare with the client's own hash to confirm the bytes arrived.
        ownership:
          type: string
          enum: [personal, shared]
          description: Who may view and manage the original document.
        knowledge_scope:
          type: string
          enum: [personal, institutional]
          description: >
            Whose answers its extracted content may support. Separate from ownership: being
            indexed never makes a personal document available to anyone else.
        ingestion: { $ref: '#/components/schemas/Ingestion' }
        course_id: { type: [string, 'null'], description: From the shelf form }
        level: { $ref: '#/components/schemas/Level' }
        semester: { $ref: '#/components/schemas/Semester' }
        document_type: { $ref: '#/components/schemas/DocumentType' }
        publication: { $ref: '#/components/schemas/Publication' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Level:
      type: [integer, 'null']
      enum: [100, 200, 300, 400, 500, 600, null]
      description: The study level. 600 only where the tenant offers it; the tenant's levels decide, not this list.
    Semester:
      type: [integer, 'null']
      enum: [1, 2, 3, null]
    DocumentType:
      type: [string, 'null']
      enum: [lecture_notes, summary, assignment, project_report, slides, other, null]
      description: >
        The student's own description of their file. Past or upcoming examination papers
        aren't a type: they're never a student's own work.
    Publication:
      type: object
      required: [status, audience]
      description: >
        private is the default. published: discoverable by authorized students of this
        tenant only. requested: waiting for a review that isn't available yet, still private.
        hidden: three distinct students reported it, so it's off the shelf until the
        tenant's takedown contact reviews it. withdrawn by the owner, or taken_down by the
        tenant. None of these changes the document's knowledge_scope.
      properties:
        status:
          type: string
          enum: [private, requested, published, hidden, withdrawn, taken_down]
        audience:
          type: [string, 'null']
          enum: [tenant, null]
          description: tenant whenever status is published or hidden; never the open internet
    ShelfDocument:
      type: object
      description: A published document as other students see it. It never names the uploader.
      required: [id, title, mime_type, size_bytes, course_id, level, semester, document_type, audience, published_at]
      properties:
        id: { type: string }
        title: { type: string }
        mime_type:
          type: string
          enum: [application/pdf, image/png, image/jpeg]
        size_bytes: { type: integer, minimum: 1 }
        course_id: { type: [string, 'null'] }
        level: { $ref: '#/components/schemas/Level' }
        semester: { $ref: '#/components/schemas/Semester' }
        document_type: { $ref: '#/components/schemas/DocumentType' }
        audience: { type: string, enum: [tenant] }
        published_at: { type: string, format: date-time }
    ShelfReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [not_own_work, examination_material, inappropriate, other]
        detail: { type: string, maxLength: 1000 }
    PublicationRequest:
      type: object
      additionalProperties: false
      required: [consent_version, declaration]
      properties:
        consent_version: { type: string, minLength: 1, maxLength: 64, description: The consent wording the student accepted }
        declaration: { $ref: '#/components/schemas/RightsDeclaration' }
    RightsDeclaration:
      type: object
      additionalProperties: false
      description: >
        What the student says about this document's rights. Recorded as what they said, not
        as legal clearance. Only own_work, shared with the tenant, can publish without review.
      required: [rights_basis, audience, redistribution, declaration_version]
      properties:
        rights_basis:
          type: string
          enum: [own_work, lecturer_provided, institution_licensed, publisher_licensed, public_domain, unknown]
        audience: { type: string, enum: [tenant] }
        redistribution: { type: string, enum: [tenant_only, permitted] }
        declaration_version: { type: string, minLength: 1, maxLength: 64, description: The declaration wording the student accepted }
    DocumentForm:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        course_id: { type: [string, 'null'] }
        level: { $ref: '#/components/schemas/Level' }
        semester: { $ref: '#/components/schemas/Semester' }
        document_type: { $ref: '#/components/schemas/DocumentType' }
    Ingestion:
      type: object
      required: [status, retry_available, failure_code, failure_message]
      properties:
        status:
          type: string
          enum: [uploaded, quarantined, rejected, queued, processing, extracted, chunked, indexed, ready, failed]
          description: >
            Only ready means the document can be used in answers. quarantined: waiting for its
            security scan; nothing opens or processes it until the scan accepts it, and an
            accepted document moves straight to queued. rejected: the scan refused the file;
            it's never served or processed, and the owner can only delete it. The scan's
            findings are never shown.
        retry_available:
          type: boolean
          description: The student can call retry now.
        failure_code: { type: [string, 'null'] }
        failure_message:
          type: [string, 'null']
          description: Safe to show. Never contains internal details.

    Assessment:
      type: object
      required: [id, course_id, title, instructions, duration_minutes, passing_score, question_count, attempt_policy, attempts_used]
      properties:
        id: { type: string }
        course_id: { type: string }
        title: { type: string }
        instructions: { type: string }
        duration_minutes: { type: integer, minimum: 1 }
        passing_score: { type: integer }
        question_count: { type: integer, minimum: 0 }
        attempt_policy: { $ref: '#/components/schemas/AttemptPolicy' }
        attempts_used:
          type: integer
          minimum: 0
          description: The attempts the caller has started, finalized or not.
    AttemptPolicy:
      type: object
      description: >
        Combinations outside these rules can't be stored. A retake needs
        retake_after_submission true, and exactly then max_attempts is null or above 1.
        after_final_attempt needs a limit, since it's never reached without one.
      required: [kind, max_attempts, retake_after_submission, result_visibility, feedback_timing, scoring_policy]
      allOf:
        - if:
            required: [retake_after_submission]
            properties: { retake_after_submission: { const: false } }
          then:
            properties: { max_attempts: { const: 1 } }
          else:
            properties: { max_attempts: { not: { const: 1 } } }
        - if:
            required: [max_attempts]
            properties: { max_attempts: { type: 'null' } }
          then:
            properties: { feedback_timing: { not: { const: after_final_attempt } } }
      properties:
        kind:
          type: string
          enum: [practice, formal]
          description: A label for how the assessment is used. It changes no enforcement.
        max_attempts:
          type: [integer, 'null']
          minimum: 1
          description: The most attempts one student may start, finalized or not. Null means no limit.
        retake_after_submission:
          type: boolean
          description: Whether another attempt may follow a finalized one, up to max_attempts.
        result_visibility:
          type: string
          enum: [immediate, after_release]
          description: >
            Whether the result can be read at all. immediate means once this attempt is
            finalized; after_release means once it's finalized and staff have released results.
        feedback_timing:
          type: string
          enum: [immediate, after_final_attempt, after_release, never]
          description: >
            Whether per-question feedback can be read, as a condition separate from
            result_visibility. Both must permit it. immediate means once this attempt is
            finalized; after_final_attempt means once attempts_used equals max_attempts and
            all are finalized; after_release uses the same staff release as results.
        scoring_policy:
          type: string
          enum: [best, latest, first]
          description: Which finalized attempt stands as the student's outcome. Each attempt's own result is unchanged.
    Attempt:
      type: object
      required: [id, assessment_id, status, started_at, expires_at, submitted_at]
      properties:
        id: { type: string }
        assessment_id: { type: string }
        status:
          type: string
          enum: [in_progress, submitted]
        started_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Set by the server. Answers are refused after it. Clients show time from this value.
        submitted_at: { type: [string, 'null'], format: date-time }
    AttemptQuestions:
      type: object
      required: [attempt_id, assessment_id, questions]
      properties:
        attempt_id: { type: string }
        assessment_id: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/AttemptQuestion' }
    AttemptQuestion:
      type: object
      required: [assessment_question_id, sequence, prompt, marks, options]
      properties:
        assessment_question_id: { type: string }
        sequence: { type: integer }
        prompt: { type: string }
        marks: { type: integer }
        options:
          type: array
          items:
            type: object
            required: [position, text]
            properties:
              position: { type: integer, minimum: 0 }
              text: { type: string }
    SaveAnswerRequest:
      type: object
      required: [selected_option_index]
      additionalProperties: false
      properties:
        selected_option_index: { type: integer, minimum: 0 }
    AttemptAnswer:
      type: object
      required: [attempt_id, assessment_question_id, selected_option_index, updated_at]
      properties:
        attempt_id: { type: string }
        assessment_question_id: { type: string }
        selected_option_index: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    AttemptAnswers:
      type: object
      required: [attempt_id, answers]
      properties:
        attempt_id: { type: string }
        answers:
          type: array
          items: { $ref: '#/components/schemas/AttemptAnswer' }
    AttemptResult:
      type: object
      required: [attempt_id, assessment_id, total_score, max_score, percentage, passed, graded_at, breakdown]
      properties:
        attempt_id: { type: string }
        assessment_id: { type: string }
        total_score: { type: integer }
        max_score: { type: integer }
        percentage: { type: number }
        passed: { type: boolean }
        graded_at: { type: string, format: date-time }
        breakdown:
          type: array
          items: { $ref: '#/components/schemas/QuestionResult' }
    QuestionResult:
      type: object
      description: >
        Never contains the correct answer, a correct option, answer-key text or an explanation.
        On a two-option question is_correct reveals the answer, so feedback timing is a
        security boundary. An unanswered question scores zero.
      required: [assessment_question_id, selected_option_index, awarded_marks, max_marks, is_correct]
      additionalProperties: false
      properties:
        assessment_question_id: { type: string }
        selected_option_index: { type: [integer, 'null'] }
        awarded_marks:
          type: [integer, 'null']
          description: Null until result and feedback are both permitted.
        max_marks: { type: integer }
        is_correct:
          type: [boolean, 'null']
          description: Null until result and feedback are both permitted.

    Conversation:
      type: object
      required: [id, title, created_at, updated_at, expires_at]
      properties:
        id: { type: string }
        title:
          type: [string, 'null']
          description: Set by the server from the first question. Null until then.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When an institution-specific policy removes it. Null means no such policy applies, not that it's kept forever; the default retention period still applies.
    SendMessageRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
    ConversationMessage:
      type: object
      required: [id, role, content, grounded, citations, redacted, created_at]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [student, assistant]
        content:
          type: string
          description: A redacted answer holds a fixed notice instead of its text.
        redacted:
          type: boolean
          description: >
            True when the answer used a document, cited or not, that was since deleted or that
            this student can no longer read. Its text and citations are then gone, and
            citations is empty. Always false for a student's message.
        grounded:
          type: [boolean, 'null']
          description: Null for a student's message.
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        created_at: { type: string, format: date-time }
    ChatAnswer:
      type: object
      required: [answer, grounded, citations, conversation_id, request_id]
      properties:
        answer: { type: string }
        grounded:
          type: boolean
          description: False means the fixed "not covered" reply, with no citations.
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        conversation_id: { type: string }
        request_id: { type: string }
    Citation:
      type: object
      required: [number, source_id, asset_id, title, page_start, page_end, excerpt]
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 1
          description: Matches the [n] in the answer text.
        source_id: { type: string }
        asset_id: { type: string }
        title: { type: string }
        page_start: { type: [integer, 'null'] }
        page_end: { type: [integer, 'null'] }
        excerpt:
          type: string
          maxLength: 500
          description: From the cited passage. Never generated.
