# Differences between contracts/mobile/openapi.yaml and the backend, enforced by
# tests/integration/test_mobile_contract_drift.py. `findings` are computed from the
# running app. A gap with only `evidence` isn't machine-checked yet. To close a gap,
# move it to `closed` with a test that proves it. See contracts/mobile/README.md.
