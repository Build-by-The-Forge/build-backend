implementation_gaps:
- id: G-01
  severity: Blocker
  summary: Students can't upload or start ingestion
  closes_in: M3-D
  findings:
  - missing_route GET /content/my-documents
  - missing_route GET /content/my-documents/{asset_id}
  - missing_route POST /content/my-documents
- id: G-02
  severity: Blocker
  summary: Upload needs a source, and students can't create one
  closes_in: M3-D
  evidence: Read from app/core/authorization.py and content routes. Replaced by the personal source behind POST
    /content/my-documents.
- id: G-04
  severity: High
  summary: Chat drops the citations and grounded flag the AI service returns
  closes_in: M3-F, M4
  evidence: Read from assistant_gateway.py. Needs the AI service to probe.
- id: G-05
  severity: High
  summary: Retrieval isn't limited to ready documents or to what this user may read
  closes_in: M4
  evidence: Phase 3 release record; ai-service retrieval.py.
- id: G-08
  severity: Medium
  summary: The course list catches every exception and returns its text
  closes_in: M3-A
  evidence: Read from app/api/catalogue/courses.py.
- id: G-09
  severity: Medium
  summary: No read routes for faculties, departments or programmes
  closes_in: M3-C
  findings:
  - missing_route GET /catalogue/departments
  - missing_route GET /catalogue/faculties
  - missing_route GET /catalogue/programmes
- id: G-11
  severity: Medium
  summary: The 60-second read limit makes large uploads fail on slower connections
  closes_in: M3-D
  evidence: 'Calculated: 25 MiB in 60 s needs 3.5 Mbit/s. Measured in M3-D.'
- id: G-12
  severity: Medium
  summary: Retry available has no student action
  closes_in: M3-D
  findings:
  - missing_route POST /content/my-documents/{asset_id}/retry
- id: G-13
  severity: Medium
  summary: No route returns a document to a student
  closes_in: M3-D
  findings:
  - missing_route GET /content/assets/{asset_id}/content
- id: G-17
  severity: Medium
  summary: No conversations
  closes_in: M3-F
  findings:
  - missing_route DELETE /ai/conversations/{conversation_id}
  - missing_route GET /ai/conversations
  - missing_route GET /ai/conversations/{conversation_id}
  - missing_route GET /ai/conversations/{conversation_id}/messages
  - missing_route POST /ai/conversations
  - missing_route POST /ai/conversations/{conversation_id}/messages
- id: G-25
  severity: High
  summary: Tenant-wide duplicate detection would disclose another student's upload
  closes_in: M3-D
  evidence: Read from uq_content_assets_tenant_hash and _receive_upload.
- id: G-26
  severity: Low
  summary: 'No way to discover a tenant slug. Accepted: FUTA is app configuration'
  closes_in: M6
  evidence: Reviewer decision at 976c88a.
- id: G-29
  severity: Medium
  summary: Assessments have no attempt policy, and a new attempt can start straight after submitting
  closes_in: Assessment lifecycle
  evidence: Reproduced over HTTP at 0ef0ba8. Not a machine check until the policy exists.
- id: G-30
  severity: High
  summary: Content sources record no rights basis, audience or redistribution limits
  closes_in: M3-D
  evidence: Read from app/infrastructure/db/models/content.py.
- id: G-31
  severity: High
  summary: Knowledge scope isn't modelled
  closes_in: M3-D, M4
  evidence: Read from content models and ai-service retrieval.py.
- id: G-32
  severity: Medium
  summary: Students can't delete a document, and handling of derived data isn't defined
  closes_in: M3-D
  findings:
  - missing_route DELETE /content/my-documents/{asset_id}
- id: G-33
  severity: High, release gate
  summary: Whether a model provider may train on retrieved passages hasn't been checked
  closes_in: Before any production provider receives content
  evidence: Governance. Provider terms not reviewed.
- id: G-34
  severity: Medium
  summary: The OCR evaluation documents have no rights record, and stay out of shared retrieval
  closes_in: Before they enter shared retrieval
  evidence: Reviewer decision at 976c88a.
- id: G-36
  severity: High
  summary: is_correct and awarded_marks are returned as soon as an attempt is submitted
  closes_in: Assessment lifecycle
  evidence: Accepted interim limitation. Read from get_attempt_result.
- id: G-37
  severity: High
  summary: Expired attempts wait for the student to submit
  closes_in: Assessment lifecycle
  evidence: 'Accepted interim limitation, recorded on #54.'
- id: G-38
  severity: High
  summary: Upload creates no job, so durable queuing doesn't exist yet
  closes_in: M3-D
  evidence: Read from app/application/content/upload.py.
closed:
- id: G-03
  summary: Students could read draft assessments
  proof: tests/integration/assessment/test_assessment_visibility.py::test_a_draft_by_direct_id_looks_like_it_does_not_exist
- id: G-15
  summary: A repeated submit answered 409
  proof: tests/integration/assessment/test_attempt_deadline.py::test_a_repeated_submit_returns_the_submitted_attempt_and_never_grades_again
- id: G-24
  summary: OpenAPI was only generated with docs on. The gate reads app.openapi(), which doesn't need them
  proof: tests/integration/test_mobile_contract_drift.py::test_observed_behaviour_matches_the_gap_allowlist
- id: G-27
  summary: Assessment time limits weren't enforced
  proof: tests/integration/assessment/test_attempt_deadline.py::test_after_the_deadline_an_answer_cannot_be_saved_or_removed
- id: G-35
  summary: Students could read the answer key during an attempt
  proof: tests/integration/assessment/test_assessment_visibility.py::test_a_student_cannot_read_the_answer_key_during_an_attempt
- id: G-06
  summary: Content read routes gave students storage locations, identities and processing internals
  proof: tests/integration/content/test_content_internal_fields.py::test_no_content_read_route_gives_a_student_an_internal_field
