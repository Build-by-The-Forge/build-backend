# Differences between contracts/mobile/openapi.yaml and the backend, enforced by
# tests/integration/test_mobile_contract_drift.py. `findings` are computed from the
# running app. A gap with only `evidence` isn't machine-checked yet. To close a gap,
# move it to `closed` with a test that proves it. See contracts/mobile/README.md.
contract_sha256: cb02161e77bfb2bd75762d68908fb8fa718d287ea702bbfa2f08d594e499146f
contract_gaps:
- id: G-07
  severity: Medium
  summary: Clients can set max_attempts and correlation_id when creating a job
  closes_in: M3-D
  evidence: Read from job_schemas.py.
- id: G-10
  severity: Medium
  summary: Catalogue, assessment and attempt lists aren't paginated, and the course list needs a trailing slash
  closes_in: M3-C, M3-E
  findings:
  - missing_query_parameter GET /assessment/assessments limit
  - missing_query_parameter GET /assessment/assessments offset
  - missing_query_parameter GET /assessment/attempts limit
  - missing_query_parameter GET /assessment/attempts offset
  - missing_query_parameter GET /catalogue/courses limit
  - missing_query_parameter GET /catalogue/courses offset
  - missing_query_parameter GET /catalogue/courses/{course_id}/topics limit
  - missing_query_parameter GET /catalogue/courses/{course_id}/topics offset
  - missing_query_parameter GET /catalogue/topics/{topic_id}/learning-outcomes limit
  - missing_query_parameter GET /catalogue/topics/{topic_id}/learning-outcomes offset
  - missing_query_parameter GET /catalogue/topics/{topic_id}/reference-materials limit
  - missing_query_parameter GET /catalogue/topics/{topic_id}/reference-materials offset
  - trailing_slash GET /catalogue/courses
- id: G-18
  severity: Medium
  summary: Chat returns raw context passages, including uncited ones
  closes_in: M3-F
  evidence: 'Read from app/api/ai.py. Not probed: the mobile contract has no such route.'
- id: G-19
  severity: Low
  summary: No way to limit a question to one document. Deferred by the reviewer
  closes_in: Deferred
  evidence: Reviewer decision at 976c88a.
- id: G-23
  severity: Low
  summary: Asset ordering has no unique tie-breaker
  closes_in: M3-D
  evidence: Read from asset_repositories.py.
- id: G-28
  severity: Low
  summary: No record of a student's programme or department
  closes_in: Later phase
  evidence: Read from app/api/catalogue/courses.py.
- id: G-39
  severity: Low
  summary: Responses carry tenant_id and user_id that the contract doesn't
  closes_in: M3-E, M3-B
  findings:
  - exposes_field GET /assessment/assessments tenant_id
  - exposes_field GET /assessment/assessments/{assessment_id} tenant_id
  - exposes_field GET /assessment/attempts tenant_id
  - exposes_field GET /assessment/attempts user_id
  - exposes_field GET /assessment/attempts/{attempt_id} tenant_id
  - exposes_field GET /assessment/attempts/{attempt_id} user_id
  - exposes_field GET /assessment/attempts/{attempt_id}/result tenant_id
  - exposes_field GET /assessment/attempts/{attempt_id}/result user_id
  - exposes_field POST /assessment/assessments/{assessment_id}/attempts tenant_id
  - exposes_field POST /assessment/assessments/{assessment_id}/attempts user_id
  - exposes_field POST /assessment/attempts/{attempt_id}/submit tenant_id
  - exposes_field POST /assessment/attempts/{attempt_id}/submit user_id
implementation_gaps:
- id: G-01
  severity: Blocker
  summary: Students can't upload or start ingestion
  closes_in: M3-D
  findings:
  - missing_route GET /content/my-documents
  - missing_route GET /content/my-documents/{asset_id}
  - missing_route POST /content/my-documents
- id: G-02
  severity: Blocker
  summary: Upload needs a source, and students can't create one
  closes_in: M3-D
  evidence: Read from app/core/authorization.py and content routes. Replaced by the personal source behind POST
    /content/my-documents.
- id: G-04
  severity: High
  summary: Chat drops the citations and grounded flag the AI service returns
  closes_in: M3-F, M4
  evidence: Read from assistant_gateway.py. Needs the AI service to probe.
- id: G-05
  severity: High
  summary: Retrieval isn't limited to ready documents or to what this user may read
  closes_in: M4
  evidence: Phase 3 release record; ai-service retrieval.py.
- id: G-09
  severity: Medium
  summary: No read routes for faculties, departments or programmes
  closes_in: M3-C
  findings:
  - missing_route GET /catalogue/departments
  - missing_route GET /catalogue/faculties
  - missing_route GET /catalogue/programmes
- id: G-11
  severity: Medium
  summary: The 60-second read limit makes large uploads fail on slower connections
  closes_in: M3-D
  evidence: 'Calculated: 25 MiB in 60 s needs 3.5 Mbit/s. Measured in M3-D.'
- id: G-12
  severity: Medium
  summary: Retry available has no student action
  closes_in: M3-D
  findings:
  - missing_route POST /content/my-documents/{asset_id}/retry
- id: G-13
  severity: Medium
  summary: No route returns a document to a student
  closes_in: M3-D
  findings:
  - missing_route GET /content/assets/{asset_id}/content
- id: G-17
  severity: Medium
  summary: No conversations
  closes_in: M3-F
  findings:
  - missing_route DELETE /ai/conversations/{conversation_id}
  - missing_route GET /ai/conversations
  - missing_route GET /ai/conversations/{conversation_id}
  - missing_route GET /ai/conversations/{conversation_id}/messages
  - missing_route POST /ai/conversations
  - missing_route POST /ai/conversations/{conversation_id}/messages
- id: G-25
  severity: High
  summary: Tenant-wide duplicate detection would disclose another student's upload
  closes_in: M3-D
  evidence: Read from uq_content_assets_tenant_hash and _receive_upload.
- id: G-26
  severity: Low
  summary: 'No way to discover a tenant slug. Accepted: FUTA is app configuration'
  closes_in: M6
  evidence: Reviewer decision at 976c88a.
- id: G-30
  severity: High
  summary: Content sources record no rights basis, audience or redistribution limits
  closes_in: M3-D
  evidence: Read from app/infrastructure/db/models/content.py.
- id: G-31
  severity: High
  summary: Knowledge scope isn't modelled
  closes_in: M3-D, M4
  evidence: Read from content models and ai-service retrieval.py.
- id: G-32
  severity: Medium
  summary: Students can't delete a document, and handling of derived data isn't defined
  closes_in: M3-D
  findings:
  - missing_route DELETE /content/my-documents/{asset_id}
- id: G-33
  severity: High, release gate
  summary: Whether a model provider may train on retrieved passages hasn't been checked
  closes_in: Before any production provider receives content
  evidence: Governance. Provider terms not reviewed.
- id: G-34
  severity: Medium
  summary: The OCR evaluation documents have no rights record, and stay out of shared retrieval
  closes_in: Before they enter shared retrieval
  evidence: Reviewer decision at 976c88a.
- id: G-38
  severity: High
  summary: Upload creates no job, so durable queuing doesn't exist yet
  closes_in: M3-D
  evidence: Read from app/application/content/upload.py.
closed:
- id: G-14
  summary: Identity bodies were untyped, so the contract couldn't describe them
  proof: tests/integration/auth/test_identity_bodies.py::test_a_malformed_body_is_a_validation_failure
- id: G-20
  summary: Mobile routes didn't return the contract's envelopes or stable error codes
  proof: tests/integration/test_success_envelope.py::test_every_success_body_on_a_route_has_the_contracts_shape
- id: G-08
  summary: The course list caught every exception and returned its text
  proof: tests/integration/test_error_envelope.py::test_an_unexpected_failure_on_the_course_list_reveals_nothing
- id: G-22
  summary: X-Request-ID was accepted with no format or length check
  proof: tests/integration/test_error_envelope.py::test_an_unsafe_request_id_is_replaced
- id: G-03
  summary: Students could read draft assessments
  proof: tests/integration/assessment/test_assessment_visibility.py::test_a_draft_by_direct_id_looks_like_it_does_not_exist
- id: G-15
  summary: A repeated submit answered 409
  proof: tests/integration/assessment/test_attempt_deadline.py::test_a_repeated_submit_returns_the_submitted_attempt_and_never_grades_again
- id: G-16
  summary: Result policy was defined by the contract and not served
  proof: tests/integration/assessment/test_result_release_api.py::test_feedback_stays_null_until_its_stage
- id: G-36
  summary: is_correct and awarded_marks were returned as soon as an attempt was submitted
  proof: tests/integration/assessment/test_result_release_api.py::test_feedback_stays_null_until_its_stage
- id: G-37
  summary: Expired attempts waited for the student to submit
  proof: tests/integration/assessment/test_attempt_finalization.py::test_the_worker_finalizes_an_expired_attempt_with_no_client
- id: G-24
  summary: OpenAPI was only generated with docs on. The gate reads app.openapi(), which doesn't need them
  proof: tests/integration/test_mobile_contract_drift.py::test_observed_behaviour_matches_the_gap_allowlist
- id: G-27
  summary: Assessment time limits weren't enforced
  proof: tests/integration/assessment/test_attempt_deadline.py::test_after_the_deadline_an_answer_cannot_be_saved_or_removed
- id: G-29
  summary: Assessments had no attempt policy, and a new attempt could start straight after submitting
